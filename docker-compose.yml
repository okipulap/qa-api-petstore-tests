services:
  petstore:
    image: swaggerapi/petstore3:1.0.27
    container_name: petstore
    ports:
      - "8080:8080"

    healthcheck:
        test: ["CMD-SHELL", "wget --no-verbose --tries=1 --spider
         http://localhost:8080/api/v3/pet/findByStatus?status=available
         || exit 1"]
        interval: 10s
        timeout: 5s
        retries: 10
