name: CI

on:
    push:
        branches: [ main, api-test ]
    pull_request:
        branches: [ main ]
    workflow_dispatch:

permissions:
        contents: read

jobs:
    test:
        runs-on: ubuntu-latest
        services:
            petstore:
                image: swaggerapi/petstore3:1.0.27
                ports:
                    - 8080:8080
                options: >-
                    --health-cmd "wget -q -O- http://localhost:8080/api/v3/pet/findByStatus?status=available || exit 1"
                    --health-interval 10s
                    --health-timeout 5s
                    --health-retries 10
        steps:
            - name: Checkout code
              uses: actions/checkout@v7

            - name: Set up JDK 21
              uses: actions/setup-java@v6
              with:
                  distribution: temurin
                  java-version: '21'
                  cache: gradle
            - name: Grant execute permission for gradlew
              run: chmod +x gradlew

            - name: Run checks
              env:
                  PETSTORE_BASE_URI: http://localhost:8080/api/
                  PETSTORE_BASE_PATH: v3/
              run: ./gradlew clean check --continue

            - name: Generate Allure report
              if: always()
              run: ./gradlew allureReport

            - name: Upload Allure HTML report
              if: always()
              uses: actions/upload-artifact@v7
              with:
                  name: allure-report
                  path: build/reports/allure-report
                  retention-days: 14
            - name: Upload JUnit test results
              if: always()
              uses: actions/upload-artifact@v7
              with:
                  name: junit-results
                  path: build/test-results/test
                  retention-days: 14

    publish-report:
        needs: test
        if: always() && github.ref == 'refs/heads/main' && github.event_name == 'push'
        runs-on: ubuntu-latest

        permissions:
            contents: read
            pages: write
            id-token: write

        environment:
            name: github-pages
            url: ${{ steps.deployment.outputs.page_url }}

        steps:
            - name: Download Allure report
              uses: actions/download-artifact@v8
              with:
                  name: allure-report
                  path: allure-report

            - name: Upload Pages artifact
              uses: actions/upload-pages-artifact@v5
              with:
                  path: allure-report

            - name: Deploy to Github Pages
              id: deployment
              uses: actions/deploy-pages@v5
